document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ly: 'Great Vibes';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fdccd382-2b38-43dd-a581-14a3aa553340\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Great Vibes';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c10019c0-42d6-46ff-9f71-50b4793dbb95\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ========================================\n   Ritmo Vivo — Design System (inline from src/styles/global.css)\n   High-contrast glassmorphic aesthetic\n   ======================================== */\n\n/* ----------------------------------------\n   1. Design Tokens\n   ---------------------------------------- */\n:root {\n  /* Backgrounds */\n  --bg:          #0b1326;\n  --surface:     #131b2e;\n  --surface-high:#171f33;\n  --card:        rgba(255, 255, 255, 0.08);\n  --card-hover:  rgba(255, 255, 255, 0.12);\n\n  /* Borders (glass) */\n  --border:      rgba(255, 255, 255, 0.10);\n  --border-md:   rgba(255, 255, 255, 0.16);\n  --border-lg:   rgba(255, 255, 255, 0.24);\n\n  /* Accent — Rose Red (primary) */\n  --red:         #e11d48;\n  --red-bright:  #ff5874;\n  --red-dim:     rgba(225, 29, 72, 0.18);\n  --red-glow:    rgba(225, 29, 72, 0.30);\n\n  /* Accent — Gold (secondary) */\n  --gold:        #e9c349;\n  --gold-light:  #ffe088;\n  --gold-dim:    rgba(233, 195, 73, 0.15);\n\n  /* Accent — Warm Orange (tertiary) */\n  --tertiary:     #ffb690;\n  --tertiary-dim: rgba(255, 182, 144, 0.15);\n\n  /* Text */\n  --text:        #dae2fd;\n  --text-muted:  #e5bdbe;\n  --text-dim:    #ac8889;\n\n  /* Typography */\n  --font-display: 'Epilogue', 'Helvetica Neue', sans-serif;\n  --font-ui:      'Epilogue', 'Helvetica Neue', sans-serif;\n  --font-body:    'Be Vietnam Pro', 'Helvetica Neue', sans-serif;\n  --font-logo:    'Great Vibes', cursive;\n\n  /* Header (glass) */\n  --header-bg: rgba(11, 19, 38, 0.72);\n\n  /* Glass & glow */\n  --glass-blur:   12px;\n  --glow-primary: 0 0 24px rgba(225, 29, 72, 0.30);\n\n  /* Spacing (4px base scale) */\n  --space-xs:  4px;\n  --space-sm:  8px;\n  --space-md:  16px;\n  --space-lg:  24px;\n  --space-xl:  40px;\n  --space-xxl: 80px;\n  --gutter:    24px;\n  --container-max: 1280px;\n  --section-pad: 80px 0;\n\n  /* Radius */\n  --radius-sm:   4px;\n  --radius:      8px;\n  --radius-md:   12px;\n  --radius-lg:   16px;\n  --radius-xl:   24px;\n  --radius-full: 9999px;\n}\n\n/* ----------------------------------------\n   2. CSS Reset & Base\n   ---------------------------------------- */\n*, *::before, *::after {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\nhtml {\n  scroll-behavior: smooth;\n}\n\nbody {\n  font-family: var(--font-body);\n  font-size: 1rem;\n  line-height: 1.65;\n  color: var(--text);\n  background-color: var(--bg);\n  overflow-x: hidden;\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ----------------------------------------\n   3. Layout Utilities\n   ---------------------------------------- */\n.app-layout {\n  min-height: 100dvh;\n  display: flex;\n  flex-direction: column;\n}\n\n.container {\n  max-width: 1300px;\n  margin: 0 auto;\n  padding: 0 24px;\n}\n\n/* ----------------------------------------\n   4. Section Titles (global)\n   ---------------------------------------- */\n.section-title {\n  font-family: var(--font-display);\n  font-size: clamp(2rem, 4vw, 3rem);\n  font-weight: 800;\n  color: var(--text);\n  text-align: center;\n  margin-bottom: 3rem;\n  position: relative;\n  letter-spacing: -0.02em;\n}\n\n.section-title::after {\n  content: \"\";\n  display: block;\n  width: 48px;\n  height: 3px;\n  background: var(--red);\n  margin: 0.75rem auto 0;\n}\n\n/* ----------------------------------------\n   5. Shared Section Styles\n   ---------------------------------------- */\nsection,\nmain {\n  scroll-margin-top: 72px;\n}\n\n.dance-styles {\n  background: var(--surface);\n  padding: var(--section-pad);\n}\n\n.styles-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));\n  gap: 1.5rem;\n  margin-top: 2.5rem;\n}\n\n.style-card {\n  background: var(--card);\n  backdrop-filter: blur(var(--glass-blur));\n  -webkit-backdrop-filter: blur(var(--glass-blur));\n  border: 1px solid var(--border);\n  padding: 2rem;\n  border-radius: var(--radius-lg);\n  text-align: center;\n  transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;\n}\n\n.style-card:hover {\n  transform: translateY(-6px);\n  border-color: var(--red-dim);\n  box-shadow: var(--glow-primary);\n}\n\n.style-icon {\n  font-size: 3rem;\n  margin-bottom: 1rem;\n}\n\n.style-card h3 {\n  font-family: var(--font-display);\n  font-size: 1.35rem;\n  color: var(--text);\n  margin-bottom: 0.75rem;\n}\n\n.quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 1.15rem;\n  margin: 2rem 0;\n  text-align: center;\n  color: var(--text-muted);\n}\n\n/* ----------------------------------------\n   6. Contact Section\n   ---------------------------------------- */\n.contact {\n  background: var(--surface);\n  color: var(--text);\n  padding: var(--section-pad);\n  border-top: 1px solid var(--border);\n}\n\n.contact .section-title {\n  color: var(--text);\n}\n\n.contact-info {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));\n  gap: 1.5rem;\n  margin-top: 2.5rem;\n  max-width: 800px;\n  margin-left: auto;\n  margin-right: auto;\n}\n\n.contact-card {\n  background: var(--card);\n  backdrop-filter: blur(var(--glass-blur));\n  -webkit-backdrop-filter: blur(var(--glass-blur));\n  border: 1px solid var(--border);\n  padding: 1.75rem;\n  border-radius: var(--radius-lg);\n  text-align: center;\n  transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;\n}\n\n.contact-card:hover {\n  border-color: var(--red);\n  transform: translateY(-4px);\n  box-shadow: var(--glow-primary);\n}\n\n.contact-icon {\n  font-size: 2rem;\n  margin-bottom: 0.75rem;\n}\n\n.contact-form {\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\n.contact-form input,\n.contact-form textarea {\n  padding: 12px 16px;\n  border-radius: var(--radius-sm);\n  border: 1px solid var(--border-md);\n  background: rgba(255, 255, 255, 0.04);\n  color: var(--text);\n  font-size: 0.9rem;\n  font-family: var(--font-body);\n  transition: border-color 0.25s ease;\n}\n\n.contact-form input::placeholder,\n.contact-form textarea::placeholder {\n  color: var(--text-dim);\n}\n\n.contact-form input:focus,\n.contact-form textarea:focus {\n  outline: none;\n  border-color: var(--red);\n}\n\n.contact-form button {\n  background: var(--red);\n  color: var(--text);\n  border: none;\n  border-radius: var(--radius-sm);\n  padding: 13px 20px;\n  font-family: var(--font-ui);\n  font-size: 0.8rem;\n  font-weight: 600;\n  letter-spacing: 0.15em;\n  text-transform: uppercase;\n  cursor: pointer;\n  transition: background 0.2s ease;\n}\n\n.contact-form button:hover {\n  background: var(--red-bright);\n}\n\n/* ----------------------------------------\n   7. Buttons\n   ---------------------------------------- */\n.btn-primary {\n  display: inline-block;\n  padding: 0.8rem 1.75rem;\n  background: linear-gradient(180deg, #ff3d63, #e11d48);\n  color: #fff;\n  text-decoration: none;\n  border-radius: var(--radius-xl);\n  font-family: var(--font-ui);\n  font-size: 0.8rem;\n  font-weight: 700;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  transition: box-shadow 0.25s ease;\n  position: relative;\n  overflow: hidden;\n  z-index: 0;\n}\n\n.btn-primary:hover {\n  box-shadow: var(--glow-primary);\n}\n\n.btn-primary::before {\n  content: '';\n  position: absolute;\n  inset: 0;\n  background: var(--red-bright);\n  transform: translateX(-100%);\n  transition: transform 0.3s ease;\n  z-index: -1;\n}\n\n.btn-primary:hover::before {\n  transform: translateX(0);\n}\n\n.btn-secondary {\n  display: inline-block;\n  padding: 0.8rem 1.75rem;\n  background: transparent;\n  color: var(--gold);\n  text-decoration: none;\n  border: 1px solid var(--gold);\n  border-radius: var(--radius-xl);\n  font-family: var(--font-ui);\n  font-size: 0.8rem;\n  font-weight: 700;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  transition: background 0.25s ease, color 0.25s ease;\n  cursor: pointer;\n}\n\n.btn-secondary:hover {\n  background: var(--gold-dim);\n  color: var(--gold-light);\n}\n\n.btn-ghost {\n  display: inline-block;\n  padding: 0.8rem 0.5rem;\n  background: none;\n  border: none;\n  color: var(--text);\n  text-decoration: none;\n  font-family: var(--font-ui);\n  font-size: 0.8rem;\n  font-weight: 700;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  cursor: pointer;\n  position: relative;\n}\n\n.btn-ghost::after {\n  content: '';\n  position: absolute;\n  left: 0.5rem;\n  right: 0.5rem;\n  bottom: 0.35rem;\n  height: 2px;\n  background: var(--red-bright);\n  transform: scaleX(0);\n  transform-origin: left;\n  transition: transform 0.25s ease;\n}\n\n.btn-ghost:hover::after {\n  transform: scaleX(1);\n}\n\n.style-chip {\n  display: inline-block;\n  padding: 4px 12px;\n  background: var(--tertiary-dim);\n  color: #fff;\n  border-radius: var(--radius-full);\n  font-family: var(--font-ui);\n  font-size: 0.7rem;\n  font-weight: 600;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n}\n\n/* ----------------------------------------\n   8. Animations & Keyframes\n   ---------------------------------------- */\n@keyframes fadeIn {\n  from { opacity: 0; transform: translateY(20px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n\n@keyframes fadeInUp {\n  from { opacity: 0; transform: translateY(32px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n\n@keyframes bounce {\n  0%, 80%, 100% { transform: translateY(0); }\n  40%           { transform: translateY(-8px); }\n}\n\n.fade-in {\n  animation: fadeIn 0.6s ease-out forwards;\n}\n\n/* ----------------------------------------\n   10. Mobile Responsive (Global)\n   ---------------------------------------- */\n@media (max-width: 985px) {\n  .section-title {\n    font-size: 2rem;\n  }\n\n  .dance-styles,\n  .contact {\n    padding: 60px 0;\n  }\n\n  .styles-grid {\n    grid-template-columns: 1fr;\n    gap: 1rem;\n  }\n\n  .contact-info {\n    grid-template-columns: 1fr;\n    gap: 1rem;\n  }\n}\n\n/* ----------------------------------------\n   11. Focus States (Accessibility)\n   ---------------------------------------- */\n:focus-visible {\n  outline: 2px solid var(--red-bright);\n  outline-offset: 3px;\n}\n\nbutton:focus-visible,\n.btn-primary:focus-visible,\n.cta-button:focus-visible,\n.submit-button:focus-visible,\n.rsvp-button:focus-visible,\n.details-button:focus-visible,\n.hero-btn:focus-visible {\n  outline: 2px solid var(--red-bright);\n  outline-offset: 2px;\n}\n\n.nav-links a:focus-visible {\n  outline: 2px solid var(--red-bright);\n  outline-offset: 2px;\n  border-radius: 2px;\n}\n\n.event-card:focus-visible {\n  outline: 2px solid var(--red-bright);\n  outline-offset: 2px;\n  border-color: var(--red-dim);\n}\n\na.logo:focus-visible {\n  outline: 2px solid var(--gold-light);\n  outline-offset: 4px;\n  border-radius: 2px;\n}\n\n.footer-links a:focus-visible {\n  outline: 2px solid var(--red-bright);\n  outline-offset: 3px;\n}\n\n.hamburger:focus-visible {\n  outline: 2px solid var(--red-bright);\n  outline-offset: 4px;\n}\n\n/* ----------------------------------------\n   12. Reduced Motion\n   ---------------------------------------- */\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n  *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n<\u002Fstyle>\n  <script src=\"6e70316d-1b9d-4447-8236-04d3e97d8a4a\"><\u002Fscript>\n  <style>\n    :root{\n      --bg:#0b1326;--surface:#131b2e;--surface-high:#171f33;\n      --red:#e11d48;--red-bright:#ff5874;--red-dim:rgba(225,29,72,0.18);\n      --gold:#e9c349;--gold-light:#ffe088;--tertiary:#ffb690;\n      --text:#dae2fd;--text-muted:#e5bdbe;--text-dim:#ac8889;\n      --border:rgba(255,255,255,0.10);--border-md:rgba(255,255,255,0.16);\n      --fdisp:'Epilogue','Helvetica Neue',sans-serif;--fbody:'Be Vietnam Pro',sans-serif;--flogo:'Great Vibes',cursive;\n    }\n    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}\n    body{background:var(--bg);color:var(--text);font-family:var(--fbody);-webkit-font-smoothing:antialiased}\n    a{color:var(--gold);text-decoration:none}\n    a:hover{color:var(--gold-light)}\n    ::selection{background:var(--red);color:#fff}\n    @keyframes rv-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n    @keyframes rv-in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}\n    @keyframes rv-fade{from{opacity:0}to{opacity:1}}\n    @keyframes rv-flip{0%,42%{opacity:0;transform:translateY(18px) rotateX(-40deg)}8%,34%{opacity:1;transform:none}50%,100%{opacity:0;transform:translateY(-18px) rotateX(40deg)}}\n    @keyframes rv-pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.35);opacity:.35}}\n    @keyframes rv-scrolldot{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(20px);opacity:0}}\n    .rv-scroll::-webkit-scrollbar{width:10px;height:10px}\n    .rv-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9999px}\n    .rv-scroll::-webkit-scrollbar-track{background:transparent}\n    image-slot{--is-empty-bg:linear-gradient(140deg,#1a2440,#241733);--is-empty-fg:var(--text-dim)}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div class=\"rv-scroll\" style=\"min-height:100vh;overflow-x:hidden\">\n\n  <!-- ================= NAV ================= -->\n  <header style=\"position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(11,19,38,0.72);border-bottom:1px solid var(--border)\">\n    <nav style=\"max-width:1280px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:24px\">\n      <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"font-family:var(--flogo);font-size:30px;line-height:1;color:var(--gold);white-space:nowrap\" style-hover=\"color:var(--gold-light)\">Salsa <span style=\"color:var(--red-bright)\">Segura<\u002Fspan><\u002Fa>\n      <ul style=\"display:flex;gap:6px;list-style:none;margin:0 auto;padding:0\" class=\"rv-navlist\">\n        <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"4\">\n          <li>\n            <a href=\"#\" sc-camel-on-click=\"{{ n.go }}\" style=\"font-family:var(--fdisp);font-weight:600;font-size:13px;letter-spacing:.04em;padding:9px 15px;border-radius:9999px;color:{{ n.fg }};background:{{ n.bg }};display:inline-block;transition:all .18s ease\" style-hover=\"color:#fff;background:rgba(255,255,255,.06)\">{{ n.label }}<\u002Fa>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n      <div style=\"display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:9999px;padding:3px;flex-shrink:0\">\n        <button type=\"button\" sc-camel-on-click=\"{{ setCityBos }}\" style=\"font-family:var(--fdisp);font-weight:700;font-size:12px;letter-spacing:.06em;padding:6px 13px;border:none;border-radius:9999px;cursor:pointer;color:{{ bosFg }};background:{{ bosBg }};transition:all .18s\">BOS<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ setCityNyc }}\" style=\"font-family:var(--fdisp);font-weight:700;font-size:12px;letter-spacing:.06em;padding:6px 13px;border:none;border-radius:9999p -size:19px\">📅<\u002Fspan><span style=\"font-size:19px;opacity:.4\">📍<\u002Fspan><span style=\"font-size:19px;opacity:.4\">👤<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align:center\">\n              <div style=\"font-family:var(--fdisp);font-weight:800;font-size:16px;color:var(--text)\">Week agenda<\u002Fdiv>\n              <div style=\"font-family:var(--fbody);font-size:12.5px;color:var(--text-dim);margin-top:3px\">Every floor, every night<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= SUBMIT ================= -->\n  <sc-if value=\"{{ isSubmit }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"Submit Event\" style=\"animation:rv-fade .4s ease both;max-width:720px;margin:0 auto;padding:56px 28px 90px\">\n      <sc-if value=\"{{ submitDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:70px 30px;border-radius:24px;border:1px solid var(--border);background:var(--surface)\">\n          <div style=\"font-size:52px;margin-bottom:12px\">🎉<\u002Fdiv>\n          <h2 style=\"font-family:var(--fdisp);font-weight:900;font-size:32px;color:var(--text);margin-bottom:12px\">On the calendar!<\u002Fh2>\n          <p style=\"font-family:var(--fbody);font-size:15px;color:var(--text-muted);max-width:44ch;margin:0 auto 26px;line-height:1.6\">Thanks for keeping the floor alive. Your event is pending review and will go live once approved.<\u002Fp>\n          <button sc-camel-on-click=\"{{ submitReset }}\" style=\"font-family:var(--fdisp);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:13px 28px;border-radius:9999px;background:linear-gradient(120deg,var(--red),#c2153c);color:#fff;border:none;cursor:pointer\">Add another<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value= (--fbody);font-size:15px;padding:13px 15px;border-radius:11px;border:1px solid var(--border-md);background:var(--surface-high);color:var(--text);outline:none\">\n                  <option value=\"\">Select<\u002Foption>\n                  <option value=\"social\">Social Dance<\u002Foption>\n                  <option value=\"class\">Class<\u002Foption>\n                  <option value=\"workshop\">Workshop<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-family:var(--fdisp);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)\">Date *<\u002Fspan>\n                <input type=\"date\" required=\"required\" value=\"{{ sfDate }}\" sc-camel-on-change=\"{{ onField }}\" id=\"date\" style=\"font-family:var(--fbody);font-size:15px;padding:13px 15px;border-radius:11px;border:1px solid var(--border-md);background:var(--surface-high);color:var(--text);outline:none;color-scheme:dark\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\" class=\"rv-formrow\">\n              <label style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-family:var(--fdisp);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)\">Venue<\u002Fspan>\n                <input type=\"text\" placeholder=\"Havana Club\" value=\"{{ sfVenue }}\" sc-camel-on-change=\"{{ onField }}\" id=\"venue\" style=\"font-family:var(--fbody);font-size:15px;padding:13px 15px;border-radius:11px;border:1px solid var(--border-md);background:var(--surface-high);color:var(--text);outline:none\">\n              <\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:8px\">\n                <span style=\"font-family:var(--fdisp);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)\">Start time<\u002Fspan>\n                <input type=\"time\" value=\"{{ sfTime }}\" sc-camel-on-change=\"{{ onField }}\" id=\"time\" style=\"font-family:var(--fbody);font-size:15px;padding:13px 15px;border-radius:11px;border:1px solid var(--border-md);background:var(--surface-high);color:var(--text);outline:none;color-scheme:dark\">\n              <\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-family:var(--fdisp);font-weight:600;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)\">Description<\u002Fspan>\n              <textarea rows=\"4\" placeholder=\"What should dancers expect?\" value=\"{{ sfDesc }}\" sc-camel-on-change=\"{{ onField }}\" id=\"desc\" style=\"font-family:var(--fbody);font-size:15px;padding:13px 15px;border-radius:11px;border:1px solid var(--border-md);background:var(--surface-high);color:var(--text);outline:none;resize:vertical\"><\u002Ftextarea>\n            <\u002Flabel>\n            <button type=\"submit\" style=\"align-self:flex-start;font-family:var(--fdisp);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:15px 34px;border-radius:9999px;background:linear-gradient(120deg,var(--red),#c2153c);color:#fff;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(225,29,72,.32)\" style-hover=\"box-shadow:0 12px 32px rgba(225,29,72,.5)\">Submit event<\u002Fbutton>\n          <\u002Fform>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <!-- FOOTER -->\n  <footer style=\"border-top:1px solid var(--border);background:rgba(255,255,255,.02)\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:40px 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px\">\n      <div>\n        <div style=\"font-family:var(--flogo);font-size:30px;color:var(--gold)\">Salsa Segura<\u002Fdiv>\n        <div style=\"font-family:var(--fbody);font-size:12.5px;color:var(--text-dim);margin-top:4px\">Passion for dance · Greater Boston &amp; NYC<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:22px;font-family:var(--fdisp);font-weight:600;font-size:13px;letter-spacing:.04em\">\n        <a href=\"https://www.instagram.com/SalsaSegura\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:var(--text-muted)\" style-hover=\"color:var(--gold-light)\">Instagram<\u002Fa>\n        <a href=\"mailto:info@SalsaSegura.com\" style=\"color:var(--text-muted)\" style-hover=\"color:var(--gold-light)\">Email<\u002Fa>\n        <a href=\"tel:+19784440922\" style=\"color:var(--text-muted)\" style-hover=\"color:var(--gold-light)\">Call<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--fbody);font-size:12px;color:var(--text-dim);width:100%;border-top:1px solid var(--border);padding-top:18px\">© {{ year }} Salsa Segura. All rights reserved.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:900},&quot;initialView&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;event&quot;,&quot;calendar&quot;,&quot;mobile&quot;,&quot;submit&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;},&quot;initialCity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;new-york-city&quot;,&quot;options&quot;:[&quot;boston&quot;,&quot;new-york-city&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Prototype&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let storedCity = null;\n    try { storedCity = localStorage.getItem(\"salsa.city\"); } catch (e) {}\n    const valid = [\"boston\", \"new-york-city\"];\n    this.state = {\n      view: this.props.initialView || \"home\",\n      city: valid.includes(this.props.initialCity) ? this.props.initialCity : (valid.includes(storedCity) ? storedCity : \"boston\"),\n      selectedId: null,\n      filter: \"all\",\n      calAnchor: Date.now(),\n      submitStatus: \"idle\",\n      sf: { title: \"\", type: \"\", date: \"\", venue: \"\", time: \"\", desc: \"\" }\n    };\n    this._events = this.buildEvents();\n  }\n  componentDidMount() {\n    this._esc = (e) => { if (e.key === \"Escape\" && this.state.view === \"event\") this.setState({ view: \"home\", selectedId: null }); };\n    window.addEventListener(\"keydown\", this._esc);\n  }\n  componentWillUnmount() { window.removeEventListener(\"keydown\", this._esc); }\n\n  buildEvents() {\n    const mk = (id, off, h, m, title, type, city, venue, address, description, lineup) => {\n      const s = new Date(); s.setDate(s.getDate() + off); s.setHours(h, m, 0, 0);\n      const e = new Date(s.getTime() + 4 * 3600 * 1000);\n      return { id: String(id), title, startDate: s, endDate: e, type, city, venue, address, description, lineup, price: type === \"social\" ? \"$15 door\" : type === \"workshop\" ? \"$30 pre-sale\" : \"$20 drop-in\", rsvp: \"https://www.instagram.com/SalsaSegura\" };\n    };\n    const dj = (name, role) => ({ name, role });\n    return [\n      mk(1, 1, 20, 0, \"Salsa Social at The Dance Union\", \"social\", \"boston\", \"The Dance Union, Somerville\", \"16 Bow St, Somerville, MA\", \"Two floors of salsa and bachata with rotating DJs. A beginner-friendly lesson kicks off at 8, then it's open dancing until late. Come solo or bring a crew — the floor rotates all night.\", [dj(\"DJ Havana\", \"Main floor · salsa dura\"), dj(\"DJ Suave\", \"Bachata room\"), dj(\"Elena R.\", \"8pm beginner lesson\")]),\n      mk(2, 3, 19, 0, \"Beginner Salsa Pop-up Class\", \"class\", \"boston\", \"Cambridge Community Center\", \"5 Callender St, Cambridge, MA\", \"No partner needed! Learn On1 salsa fundamentals in a friendly, welcoming environment. All levels welcome and rotations keep everyone moving.\", [dj(\"Marco T.\", \"Lead instructor\"), dj(\"Sofia L.\", \"Follow technique\")]),\n      mk(3, 4, 21, 0, \"Havana Nights — Latin Social\", \"social\", \"boston\", \"Havana Club, Central Square\", \"288 Green St, Cambridge, MA\", \"The classic Cambridge Latin night: salsa, bachata, merengue, and cha-cha until 1 AM. Live percussion sits in with the DJ for the midnight set.\", [dj(\"DJ Ritmo\", \"Resident DJ\"), dj(\"Los Timbaleros\", \"Live percussion\")]),\n      mk(4, 6, 14, 0, \"Bachata Musicality Workshop\", \"workshop\", \"boston\", \"Green Street Studios\", \"185 Green St, Cambridge, MA\", \"A deep dive into rhythm, breaks, and body movement with guest instructor María Torres. Bring water and shoes you can pivot in.\", [dj(\"María Torres\", \"Guest instructor\"), dj(\"Green St. Studios\", \"Host venue\")]),\n      mk(5, 8, 19, 0, \"Salsa On2 Intermediate\", \"class\", \"boston\", \"Boston Dance Collective\", \"551 Tremont St, Boston, MA\", \"Level up your On2 timing with partnerwork patterns and shines. Solid On1 foundation recommended.\", [dj(\"Danny V.\", \"On2 specialist\")]),\n      mk(6, 12, 19, 0, \"Rooftop Sunset Social\", \"social\", \"boston\", \"Seaport Rooftop, Boston\", \"85 Northern Ave, Boston, MA\", \"Golden-hour dancing over the harbor. Bring dance shoes and a light layer — the breeze picks up after sunset.\", [dj(\"DJ Marea\", \"Sunset set\"), dj(\"Coco\", \"Late-night bachata\")]),\n      mk(7, 8, 21, 0, \"Salsa Tuesdays in Chelsea\", \"social\", \"new-york-city\", \"Taj Lounge, Chelsea\", \"48 W 21st St, New York, NY\", \"NYC's classic midweek salsa party. On2 heaven with live DJ sets and a guest performance at midnight.\", [dj(\"DJ NYC Mambo\", \"On2 sets\"), dj(\"Eddie & Nina\", \"Midnight performance\")]),\n      mk(8, 5, 18, 30, \"Bachata Sensual Pop-up\", \"class\", \"new-york-city\"  b) => a.startDate - b.startDate).slice(0, 3).map((e) => this.cardData(e));\n      detail = {\n        detTitle: ev.title, detType: this.typeLabel(ev.type), detTypeFg: c.chipFg, detTypeBg: c.chipBg,\n        detDate: d.toLocaleDateString(\"en-US\", { weekday: \"long\", month: \"long\", day: \"numeric\" }),\n        detTime: this.fmtTime(d) + \" – \" + this.fmtTime(ev.endDate),\n        detPrice: ev.price, detDescription: ev.description, detVenue: ev.venue, detAddress: ev.address,\n        detRsvp: ev.rsvp, detMap: \"https://maps.google.com/?q=\" + encodeURIComponent(ev.address),\n        detLineup: (ev.lineup || []).map((l) => ({ initial: l.name.charAt(0), name: l.name, role: l.role })),\n        shareBtns: [{ label: \"Copy link\" }, { label: \"Instagram\" }, { label: \"Text\" }],\n        relatedCards: related\n      };\n    }\n\n    // calendar week\n    const anchor = new Date(s.calAnchor);\n    const ws = this.weekStart(anchor); const we = new Date(ws); we.setDate(we.getDate() + 6);\n    const sameMonth = ws.getMonth() === we.getMonth();\n    const calRangeLabel = sameMonth\n      ? ws.toLocaleDateString(\"en-US\", { month: \"long\" }) + \" \" + ws.getDate() + \" – \" + we.getDate() + \", \" + we.getFullYear()\n      : ws.toLocaleDateString(\"en-US\", { month: \"short\", day: \"numeric\" }) + \" – \" + we.toLocaleDateString(\"en-US\", { month: \"short\", day: \"numeric\" }) + \", \" + we.getFullYear();\n    const todayKey = this.dateKey(now);\n    const calColumns = Array.from({ length: 7 }, (_, i) => {\n      const day = new Date(ws); day.setDate(day.getDate() + i); const key = this.dateKey(day);\n      const isToday = key === todayKey;\n      const dayEvents = events.filter((e) => this.dateKey(e.startDate) === key).sort((a, b) => a.startDate - b.startDate).map((e) => {\n        const cc = this.typeColors(e.type);\n        return { title: e.title, time: this.fmtTime(e.startDate), bg: cc.bg, fg: cc.fg, accent: cc.accent, open: () => this.openEvent(e.id) };\n ? \"#fff\" : \"var(--text-dim)\", nycBg: s.city === \"new-york-city\" ? \"var(--red)\" : \"transparent\",\n      setCityBos: () => this.setCity(\"boston\"), setCityNyc: () => this.setCity(\"new-york-city\"),\n      heroStats, tickerRun,\n      hasFeatured: !!featured, featured: featured || {},\n      filterChips, activeFilterLabel: (filterDefs.find((f) => f.k === s.filter) || {}).l,\n      feedCards, hasFeed: feedCards.length > 0, feedEmpty: feedCards.length === 0,\n      calRangeLabel, calColumns,\n      calToday: () => this.setState({ calAnchor: Date.now() }),\n      calPrev: () => this.setState((st) => { const d = new Date(st.calAnchor); d.setDate(d.getDate() - 7); return { calAnchor: d.getTime() }; }),\n      calNext: () => this.setState((st) => { const d = new Date(st.calAnchor); d.setDate(d.getDate() + 7); return { calAnchor: d.getTime() }; }),\n      phoneFeed, phoneAgenda,\n      submitForm: s.submitStatus !== \"done\", submitDone: s.submitStatus === \"done\",\n      sfTitle: s.sf.title, sfType: s.sf.type, sfDate: s.sf.date, sfVenue: s.sf.venue, sfTime: s.sf.time, sfDesc: s.sf.desc,\n      onField: (e) => { const id = e.target.id, v = e.target.value; this.setState((st) => ({ sf: Object.assign({}, st.sf, { [id]: v }) })); },\n      onSubmit: (e) => { e.preventDefault(); this.setState({ submitStatus: \"done\" }); setTimeout(() => { try { window.scrollTo({ top: 0 }); } catch (er) {} }, 0); },\n      submitReset: () => this.setState({ submitStatus: \"idle\", sf: { title: \"\", type: \"\", date: \"\", venue: \"\", time: \"\", desc: \"\" } }),\n      year: String(new Date().getFullYear())\n    }, detail);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
